name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned environment
        run: |
          uv venv --python 3.11.15 .venv
          uv pip sync --python .venv requirements-dev.lock
      - name: Python regressions (offline)
        run: uv run --no-project --python .venv python -X utf8 -m pytest -q
      - name: Public tree and JavaScript checks
        run: |
          uv run --no-project --python .venv python scripts/check_public.py
          node --test tests/ui_api.test.cjs
          for file in app/static/*.js; do node --check "$file"; done
      - name: Python correctness lint
        run: uvx ruff check app tests/app scripts --select E9,F63,F7,F82

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Scan full Git history (redacted)
        run: python scripts/scan_secrets.py
      - name: Audit locked runtime dependencies
        run: uvx pip-audit -r requirements-server.lock --no-deps --disable-pip

  container:
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: topic-radar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify server startup and authentication
        run: |
          uv venv --python 3.11.15 .venv
          uv pip sync --python .venv requirements-dev.lock
          uv run --no-project --python .venv python -m scripts.container_smoke topic-radar:ci
