name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate version and prepare names
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cat VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$VERSION"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.number }}
            ${{ steps.version.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.number }}
            VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Source archives and checksums
        env:
          VERSION: ${{ steps.version.outputs.number }}
          IMAGE: ${{ steps.version.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="content-radar-$VERSION/" HEAD > "dist/content-radar-$VERSION.zip"
          git archive --format=tar --prefix="content-radar-$VERSION/" HEAD | gzip -n > "dist/content-radar-$VERSION.tar.gz"
          printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" > dist/container-digest.txt
          (cd dist && sha256sum *.zip *.tar.gz container-digest.txt > SHA256SUMS)
          cp CHANGELOG.md dist/release-notes.md
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS dist/container-digest.txt \
            --verify-tag --prerelease --title "Topic Radar $RELEASE_TAG" --notes-file dist/release-notes.md
