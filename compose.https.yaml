services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RADAR_DOMAIN: ${RADAR_DOMAIN:?Set RADAR_DOMAIN to your public domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      radar:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
